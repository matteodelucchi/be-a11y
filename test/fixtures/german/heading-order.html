<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Testseite - Überschriften-Reihenfolge</title>
</head>
<body>
    <h1>Haupttitel</h1>
    <h2>Abschnitt 1</h2>
    <h3>Unterabschnitt 1.1</h3>
    <!-- Richtig: h3 folgt auf h2 -->
    
    <h2>Abschnitt 2</h2>
    <!-- Falsch: h4 folgt auf h2 (überspringt h3) -->
    <h4>Sollte h3 sein</h4>
</body>
</html>
