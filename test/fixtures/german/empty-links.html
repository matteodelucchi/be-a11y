<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Testseite - Leere Links</title>
</head>
<body>
    <h1>Links</h1>
    
    <!-- Falsch: leerer Link ohne href -->
    <a></a>
    
    <!-- Falsch: leerer Link mit href="#" -->
    <a href="#"></a>
    
    <!-- Richtig: Link mit Text -->
    <a href="https://beispiel.de">Beispiel</a>
    
    <!-- Richtig: Link mit aria-label -->
    <a href="https://beispiel.de" aria-label="Zuhause"></a>
    
    <!-- Falsch: Link mit Bild ohne alt -->
    <a href="https://beispiel.de"><img src="icon.png" alt=""></a>
    
    <!-- Richtig: Link mit Bild mit alt -->
    <a href="https://beispiel.de"><img src="logo.png" alt="Logo"></a>
</body>
</html>
