<body>
    <h1>Kontrast-Tests</h1>
    
    <!-- Falsch: Geringer Kontrast (weiß auf hellgrau) -->
    <p style="color: white; background-color: #eee;">Niedriger Kontrast</p>
    
    <!-- Richtig: Guter Kontrast (schwarz auf weiß) -->

    <!-- Falsch: Geringer Kontrast (hellgrau auf weiß) -->
    <p style="color: #ccc; background-color: white;">Niedriger Kontrast 2</p>
