<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Testseite - Iframe-Titel</title>
</head>
<body>
    <h1>Iframes</h1>
    
    <!-- Falsch: Iframe ohne title -->
    <iframe src="https://beispiel.de"></iframe>
    
    <!-- Falsch: Iframe mit leerem title -->
    <iframe src="https://beispiel.de" title=""></iframe>
    
    <!-- Richtig: Iframe mit title -->
    <iframe src="https://beispiel.de" title="Beispiel-Website"></iframe>
    
    <!-- Falsch: Iframe mit nur Leerzeichen im title -->
    <iframe src="https://beispiel.de" title="   "></iframe>
</body>
</html>
