<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Testseite - Langer Alt-Text</title>
</head>
<body>
    <h1>Bilder</h1>
    <!-- Alt-Text ist zu lang (mehr als 125 Zeichen) -->
    <img src="komplexes-bild.png" alt="Dies ist ein sehr langer und ausfuehrlicher Beschreibungstext der die Details des Bildes genau erklärt und dabei die Grenze von 125 Zeichen überschreitet was bei deutschen Texten schnell passieren kann">
    
    <!-- Alt-Text ist in Ordnung (unter 125 Zeichen) -->
    <img src="bild.png" alt="Ein Bild mit einer angemessenen Beschreibung">
</body>
</html>
