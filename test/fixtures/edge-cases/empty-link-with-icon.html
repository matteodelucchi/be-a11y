<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Page - Empty Link with Icon</title>
</head>
<body>
    <h1>Icons</h1>
    <!-- Incorrect: link with only decorative icon (empty alt) -->
    <a href="https://example.com"><img src="icon.png" alt=""></a>
    
    <!-- Correct: link with icon that has descriptive alt -->
    <a href="https://example.com"><img src="icon.png" alt="Home"></a>
    
    <!-- Incorrect: link with no href and no content -->
    <a></a>
</body>
</html>
