name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - master
      - release/*

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build verification
        run: |
          npm run build
          if [ ! -f "dist/index.js" ]; then
            echo "Error: Build failed"
            exit 1
          fi

  accessibility-self-check:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run be-a11y on example files
        run: |
          # Run on any HTML files in the repo (except node_modules and test files)
          node index.js . > /tmp/a11y-report.txt 2>&1 || true
          
          # Check for critical issues
          if grep -q "🚨 Accessibility Issues Found" /tmp/a11y-report.txt; then
            echo "::warning:: Accessibility issues found in the codebase"
            cat /tmp/a11y-report.txt
            # Don't fail the job - just warn
          else
            echo "✅ No accessibility issues found"
          fi

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: /tmp/a11y-report.txt
          retention-days: 7
