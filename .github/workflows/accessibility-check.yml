name: Accessibility Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  accessibility:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🔍 Run Accessibility Checker
        run: |
          # Check if public directory exists, otherwise check current directory
          if [ -d "./public" ]; then
            TARGET="./public"
          else
            TARGET="."
          fi
          node index.js $TARGET > output.txt || true
          cat output.txt
          grep "🚨 Accessibility Issues Found" output.txt && exit 1 || echo "No critical issues."

      - name: 📤 Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: output.txt
